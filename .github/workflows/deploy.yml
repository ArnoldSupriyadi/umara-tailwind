name: Deploy (self-hosted VPS)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Sync & Build on VPS
        run: |
          set -e
          cd /var/www/umaragroup/umara-tailwind
          echo "==> Git sync"
          git fetch origin main
          git reset --hard origin/main

          echo "==> Install deps & build"
          npm ci
          npm run build

          echo "==> Nginx reload"
          sudo -n /usr/sbin/nginx -t
          sudo -n /usr/bin/systemctl reload nginx
